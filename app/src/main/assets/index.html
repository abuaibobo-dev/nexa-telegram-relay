<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Relay</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="extra.css"></head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-head"><div class="logo">⚡</div><b>RELAY</b></div>
  <div class="sidebar-nav">
    <button data-page="channels" onclick="openPage('channels')">◫ 频道管理</button>
    <button data-page="rules" onclick="openPage('rules')">◇ 采集规则</button>
    <button data-page="settings" onclick="openPage('settings')">⚙ 设置</button>
  </div>
  <div class="sidebar-foot">
    <div class="sidebar-status"><span id="svcDot" class="dot off"></span><span id="svcText">已停止</span></div>
  </div>
</div>
<div class="sidebar-mask" id="sidebarMask" onclick="closeSidebar()"></div>

<!-- Main -->
<div class="main">
  <!-- Top bar -->
  <div class="topbar">
    <button class="menu-btn" onclick="openSidebar()">☰</button>
    <span class="topbar-title">RELAY</span>
    <span class="topbar-status" id="topStatus">0 条规则</span>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <!-- Log stream (startup) -->
    <div class="log-stream" id="logStream">
      <div class="log-stream-head" onclick="toggleLogStream()">
        <span>📋 系统日志</span>
        <span class="fold-arrow" id="logArrow">›</span>
      </div>
      <div class="log-stream-body" id="logBody"></div>
    </div>
    <!-- Messages -->
    <div id="chatMessages"></div>
  </div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <button class="input-action" onclick="sendQuickCmd('/status')">📊</button>
      <button class="input-action" onclick="sendQuickCmd('/bind')">🔗</button>
      <div class="chat-input-box">
        <textarea id="chatInput" rows="1" placeholder="说点什么..." oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendChat()">↑</button>
    </div>
  </div>
</div>

<!-- Pages (overlay) -->
<div class="page-overlay" id="pageOverlay">
  <div class="page-overlay-head">
    <button class="back-btn" onclick="closePage()">←</button>
    <span id="pageTitle"></span>
  </div>
  <div class="page-overlay-body" id="pageBody"></div>
</div>

<script src="app.js"></script>
</body></html>
