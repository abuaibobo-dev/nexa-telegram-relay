<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Relay</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="extra.css"></head>
<body><div class="orb one"></div><div class="orb two"></div><header><div class="logo">⚡</div><div><b>RELAY</b><small>频道采集器</small></div></header><main>
<section id="dashboard" class="page active"><div id="systemAlert" class="notice status-banner">等待完成首次配置</div><div class="status-bar"><span id="health" class="status-chip off">已停止</span><span class="status-rules"><span id="running">0</span> 条规则</span></div><div class="cards cards-compact"><article><small>处理</small><strong id="collected">0</strong></article><article><small>转发</small><strong id="forwarded">0</strong></article><article><small>过滤</small><strong id="filtered">0</strong></article></div><div class="ctrl-row"><button class="ctrl-btn ctrl-start" id="toggleRun">▶ 启动</button><button class="ctrl-btn ctrl-pause" id="pauseAllDash">⏸ 暂停</button><button class="ctrl-btn ctrl-stop" id="emergencyStop">⏹ 停止</button></div><div class="glass panel panel-compact log-panel"><div class="log-header"><small>最近日志</small><div><button class="log-btn" id="exportLogs">复制</button><button class="log-btn" id="clearLogs">清空</button></div></div><div class="log-mini" id="logList">暂无记录</div></div><div class="glass panel panel-compact"><div class="pipeline"><b>来源</b><i>→</i><b>过滤</b><i>→</i><b>发送</b><i>→</i><b>目标</b></div></div><div class="glass panel onboarding panel-compact"><small>快速开始</small><div class="steps"><b>1 API</b><i>→</i><b>2 登录</b><i>→</i><b>3 频道</b><i>→</i><b>4 规则</b></div></div></section>
<section id="channels" class="page"><div class="ch-header"><h1>频道管理</h1><button class="sync-btn" id="tgSync">⟳ 同步频道</button></div><div class="ch-tabs"><button class="ch-tab active" data-tab="source">来源 <span id="srcCount">0</span></button><button class="ch-tab" data-tab="target">目标 <span id="tgtCount">0</span></button><button class="ch-tab" data-tab="unassigned">待分配 <span id="unCount">0</span></button></div><div id="channelList" class="list"></div><div class="glass panel panel-compact" style="margin-top:12px"><div class="form"><input id="channelName" placeholder="手动添加频道名称"><div class="form-row"><select id="channelRole"><option value="source">来源</option><option value="target">目标</option></select><button id="addChannel">添加</button></div></div></div></section>
<section id="rules" class="page"><div class="eyebrow">COLLECTION RULES</div><h1>采集规则</h1><div class="glass panel"><label>目标频道（可多选）<div id="ruleTarget" class="check-group"></div></label><label>可绑定来源<select id="ruleSource"></select></label><label>规则备注<input id="ruleNote" placeholder="例如：素材频道 A"></label><label>采集起点<select id="startMode"><option selected>最早消息</option><option>最新消息之后</option><option>指定消息ID</option></select></label><label>指定消息 ID<input id="startMessageId" inputmode="numeric" placeholder="仅指定消息ID模式使用"></label><label>采集类型<select id="mediaType"><option>图片＋视频</option><option>仅图片</option><option>仅视频</option><option>仅文本</option><option>仅文件</option><option>仅 GIF</option><option>仅音频</option><option>仅语音</option><option>完整媒体组</option><option>全部内容</option></select></label><label>媒体组处理<select id="albumMode"><option>整组保留</option><option>组内筛选</option><option>整组跳过</option></select></label><label>媒体说明<select id="captionMode"><option>保留说明</option><option>删除说明</option></select></label><label>排除关键词<input id="keywords" placeholder="逗号分隔，可留空"></label><label>每日上限（0 不限制）<input id="dailyLimit" type="number" min="0" value="0"></label><label>运行开始小时<input id="runFrom" type="number" min="0" max="23" value="0"></label><label>运行结束小时<input id="runTo" type="number" min="1" max="24" value="24"></label><button class="primary" id="bindRule">保存并绑定</button><div class="item-actions"><button id="pauseAll">暂停全部</button><button id="resumeAll">恢复全部</button><button id="exportConfig">导出配置</button><button id="importConfig">导入配置</button></div></div><div id="ruleList" class="list"></div></section>


<section id="settings" class="page"><h1>设置</h1>
<div class="fold" data-fold="tg"><div class="fold-head" onclick="toggleFold(this)"><span>🔐 Telegram API</span><span class="fold-arrow">›</span></div><div class="fold-body"><label>API ID<input id="apiId" inputmode="numeric" placeholder="从 my.telegram.org 获取"></label><label>API Hash<input id="apiHash" type="password" placeholder="加密保存在本机"></label><div id="tgStatus" class="fold-status"></div><button class="primary" id="saveSettings">保存</button></div></div>
<div class="fold" data-fold="proxy"><div class="fold-head" onclick="toggleFold(this)"><span>🌐 代理设置</span><span class="fold-arrow">›</span></div><div class="fold-body"><label>类型<select id="proxyType"><option>关闭</option><option>SOCKS5</option><option>HTTP</option></select></label><label>服务器<input id="proxyServer" placeholder="127.0.0.1"></label><label>端口<input id="proxyPort" type="number" min="1" max="65535" placeholder="1080"></label><label>用户名<input id="proxyUser" autocomplete="off"></label><label>密码<input id="proxyPassword" type="password"></label><button class="primary secondary" id="saveProxy">保存代理</button></div></div>
<div class="fold" data-fold="ai"><div class="fold-head" onclick="toggleFold(this)"><span>🤖 DeepSeek（可选）</span><span class="fold-arrow">›</span></div><div class="fold-body"><label>API Key<input id="deepseekKey" type="password" placeholder="用于内容分析"></label><label>测试<textarea id="aiSample" placeholder="粘贴频道文案测试"></textarea></label><button class="primary secondary" id="testAi">测试分析</button><pre id="aiResult" class="ai-result">尚未测试</pre></div></div>
</section>
</main><nav><button data-page="dashboard" class="active">⌂<span>总览</span></button><button data-page="channels">◫<span>频道</span></button><button data-page="rules">◇<span>规则</span></button><button data-page="settings">⚙<span>设置</span></button></nav><script src="app.js"></script></body></html>
